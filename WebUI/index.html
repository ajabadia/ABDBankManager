<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABD Universal Bank Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <script type="importmap">
    {
      "imports": {
        "dexie": "https://esm.sh/dexie@4.4.5",
        "jszip": "https://esm.sh/jszip@3.10.1",
        "file-saver": "https://esm.sh/file-saver@2.0.5"
      }
    }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --accent: #00d4ff;
            --accent-dim: #00d4ff22;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --border: #30363d;
            --success: #3fb950;
            --warning: #d29922;
            --error: #f85149;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            gap: 1rem;
        }
        .header h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #3fb950);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }
        .header-actions { display: flex; gap: 0.5rem; align-items: center; flex-shrink: 0; }
        .version-badge {
            background: var(--accent-dim);
            color: var(--accent);
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
        }
        .midi-status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .midi-status:hover { border-color: var(--accent); }
        .midi-status.connected { border-color: var(--success); background: rgba(63,185,80,0.1); }
        .midi-status .midi-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--text-secondary);
            flex-shrink: 0;
            transition: all 0.1s;
        }
        .midi-status.connected .midi-dot { background: var(--success); }
        .midi-status .midi-label { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }

        /* Main layout */
        .main-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: calc(100vh - 72px);
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .sidebar-search {
            padding: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-search input {
            width: 100%;
            padding: 0.4rem 0.6rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.8rem;
            font-family: inherit;
        }
        .sidebar-search input:focus { outline: none; border-color: var(--accent); }
        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 0.25rem;
        }
        .list-item {
            padding: 0.45rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: background 0.1s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .list-item:hover { background: var(--bg-tertiary); }
        .list-item.active { background: var(--accent-dim); color: var(--accent); }
        .list-item .item-thumb { width: 28px; height: 18px; object-fit: contain; border-radius: 3px; flex-shrink: 0; background: var(--bg-tertiary); }
        .list-item .item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .list-item .item-badge {
            font-size: 0.6rem;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .list-item .item-actions { display: none; gap: 0.2rem; }
        .list-item:hover .item-actions { display: flex; }
        .list-item:hover .item-badge { display: none; }
        .list-empty { padding: 1.5rem; text-align: center; color: var(--text-secondary); font-size: 0.8rem; }
        .list-section-header {
            padding: 0.4rem 0.6rem;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            user-select: none;
        }
        .list-section-header:hover { color: var(--text-primary); }
        .list-section-header .arrow { transition: transform 0.15s; font-size: 0.5rem; }
        .list-section-header.collapsed .arrow { transform: rotate(-90deg); }
        .list-section-body { padding-left: 0.5rem; }
        .list-section-body.hidden { display: none; }

        /* Main content — single scroll container */
        .main-content {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 1.5rem;
            gap: 1.5rem;
        }

        /* Panels */
        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .panel-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-title { font-size: 0.85rem; font-weight: 600; }
        .panel-body { padding: 1rem; }

        /* Model grid */
        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .model-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            text-align: center;
        }
        .model-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .model-card.active { border-color: var(--accent); background: var(--accent-dim); }
        .model-card .card-thumb { width: 100%; max-width: 140px; height: 80px; object-fit: contain; border-radius: 4px; }
        .model-card .card-name { font-weight: 600; font-size: 0.85rem; }
        .model-card .card-meta { font-size: 0.7rem; color: var(--text-secondary); }
        .model-card .card-badges { display: flex; gap: 0.3rem; flex-wrap: wrap; justify-content: center; }

        /* Bank grid */
        .bank-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
        }
        .bank-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .bank-card:hover { border-color: var(--accent); }
        .bank-card.active { border-color: var(--accent); background: var(--accent-dim); }
        .bank-card .bank-thumb { width: 100%; height: 60px; object-fit: contain; border-radius: 4px; background: var(--bg-primary); }
        .bank-card .bank-name { font-weight: 600; font-size: 0.8rem; }
        .bank-card .bank-meta { font-size: 0.65rem; color: var(--text-secondary); }
        .bank-card-new {
            border-style: dashed;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .bank-card-new:hover { color: var(--accent); border-color: var(--accent); }

        /* Manufacturer header */
        .manufacturer-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1rem 0;
        }
        .manufacturer-logo { max-height: 80px; max-width: 200px; object-fit: contain; }

        /* Hardware header */
        .hardware-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }
        .hardware-logo { max-height: 60px; max-width: 120px; object-fit: contain; }
        .hardware-thumb { max-height: 100px; max-width: 160px; object-fit: contain; border-radius: 6px; }
        .hardware-info { flex: 1; }
        .hardware-info h2 { font-size: 1.2rem; margin-bottom: 0.3rem; }
        .hardware-info .hw-meta { font-size: 0.8rem; color: var(--text-secondary); }
        .hardware-info .hw-badges { display: flex; gap: 0.4rem; margin-top: 0.4rem; flex-wrap: wrap; }

        /* Bank header */
        .bank-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.75rem;
        }
        .bank-header .bank-thumb-lg { height: 80px; object-fit: contain; border-radius: 6px; }
        .bank-header .bank-info h2 { font-size: 1rem; }
        .bank-header .bank-info .bk-meta { font-size: 0.75rem; color: var(--text-secondary); }

        /* Action bar */
        .action-bar {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            padding: 0.5rem 0;
        }

        /* Patch list in content */
        .patch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.5rem;
        }
        .patch-chip {
            padding: 0.4rem 0.6rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .patch-chip:hover { border-color: var(--accent); }
        .patch-chip.active { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
        .patch-chip .patch-cat { font-size: 0.55rem; color: var(--text-secondary); margin-left: auto; }
        .patch-compare-check { accent-color: var(--warning); cursor: pointer; margin-right: 0.3rem; flex-shrink: 0; }

        /* Patch detail */
        .patch-detail { padding: 1rem 0; }
        .patch-info { display: flex; flex-direction: column; gap: 0.6rem; }
        .patch-info-field { display: flex; flex-direction: column; gap: 0.2rem; }
        .patch-info-label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
        .patch-info-input {
            padding: 0.4rem 0.6rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
        }
        .patch-info-input:focus { outline: none; border-color: var(--accent); }
        .param-select {
            padding: 0.4rem 0.6rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
        }

        /* Interpreted parameters */
        .interpreted-parameters { margin-top: 1rem; }
        .parameter-table-wrap { overflow-x: auto; }
        .parameter-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .parameter-table th { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); color: var(--text-secondary); font-weight: 600; }
        .parameter-table td { padding: 0.35rem 0.6rem; border-bottom: 1px solid var(--border); }
        .parameter-value { font-family: 'JetBrains Mono', monospace; color: var(--accent); }

        /* SysEx viewer */
        .sysex-viewer { margin-top: 0.75rem; }
        .sysex-controls { display: flex; gap: 0.3rem; margin-bottom: 0.5rem; }
        .sysex-hex {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.75rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            line-height: 1.5;
            color: var(--text-secondary);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn:hover { background: var(--border); }
        .btn-primary { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); font-weight: 600; }
        .btn-primary:hover { opacity: 0.85; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.7rem; }
        .btn-icon { padding: 0.25rem; width: 24px; height: 24px; justify-content: center; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Toast */
        #toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 1000; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast { padding: 0.6rem 1rem; border-radius: 8px; font-size: 0.8rem; animation: slideIn 0.3s; max-width: 350px; }
        .toast.success { background: rgba(63,185,80,0.9); color: #fff; }
        .toast.error { background: rgba(248,81,73,0.9); color: #fff; }
        .toast.info { background: rgba(0,212,255,0.9); color: #000; }
        .toast.warning { background: rgba(210,153,34,0.9); color: #000; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* MF.16 Backup reminder */
        .backup-reminder {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 1.5rem;
            background: rgba(210,153,34,0.12);
            border-bottom: 1px solid rgba(210,153,34,0.3);
            font-size: 0.82rem;
            color: var(--warning);
            animation: slideDown 0.3s;
        }
        .backup-reminder-icon { font-size: 1.1rem; }
        .backup-reminder-text { flex: 1; }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 500;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            min-width: 360px;
            max-width: 500px;
        }
        .modal h3 { font-size: 1rem; margin-bottom: 1rem; }
        .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }

        /* Welcome state */
        .welcome { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
        .welcome h2 { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text-primary); }
        .welcome p { font-size: 0.85rem; max-width: 400px; margin: 0 auto; }

        /* Drop overlay */
        .drop-overlay-content {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent);
            text-align: center;
            padding: 2rem;
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 2px solid var(--accent);
        }
        .drop-overlay-content small { font-size: 0.8rem; color: var(--text-secondary); font-weight: 400; }

        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .sidebar { max-height: 35vh; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>ABD Bank Manager</h1>
        <div class="header-actions">
            <div class="midi-status" id="midi-status" title="Conectar MIDI">
                <span class="midi-dot"></span>
                <span class="midi-label" id="midi-label">MIDI</span>
            </div>
            <button class="btn btn-sm" id="btn-help" title="Atajos de teclado (?)">?</button>
            <span id="version" class="version-badge">v0.1.0</span>
        </div>
    </header>

    <div class="main-grid">
        <aside class="sidebar">
            <div class="sidebar-search">
                <input type="search" id="global-search" placeholder="Buscar...">
            </div>
            <ul class="sidebar-list" id="nav-list"></ul>
        </aside>

        <main class="main-content" id="main-content">
            <div class="welcome" id="panel-welcome">
                <h2>ABD Universal Bank Manager</h2>
                <p>Selecciona un fabricante en la barra lateral para empezar, o conecta un hardware MIDI.</p>
            </div>
            <div id="panel-content" style="display:none;"></div>
        </main>
    </div>

    <div id="toast-container"></div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-content"></div>
    </div>

    <script type="module" src="./src/app.js"></script>
</body>
</html>
