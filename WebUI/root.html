<!DOCTYPE html>
<html lang="en" data-theme="ms2000">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:;">
    <!-- Estas cinco rutas van SIN prefijo vendor/ a proposito: es la unica
         forma que sirve en los tres mundos con el mismo index.html —
         embebido (el resource provider resuelve por basename), vite dev y
         dist (publicDir=vendor copia vendor/* en la raiz). Con vendor/ el
         embebido y dev funcionan, pero dist 404. -->
    <script type="importmap">
    {
      "imports": {
        "dexie": "./dexie/dexie.mjs",
        "jszip": "./jszip.mjs",
        "file-saver": "./FileSaver.mjs"
      }
    }
    </script>
    <title>ABD Universal Bank Manager</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='20' y='20' width='60' height='60' rx='12' fill='none' stroke='%23888' stroke-width='8'/><circle cx='50' cy='50' r='10' fill='%23888'/></svg>">
    <!-- Diseno unificado: SSOT en ABDSharedAssets/styles (extraido a bank-manager.css) -->
    <link rel="stylesheet" href="./src/styles/bank-manager.css">
</head>
<body>
    <header class="header">
        <h1>ABD Bank Manager</h1>
        <div class="header-actions">
            <div class="midi-status" id="midi-status" title="Connect MIDI">
                <span class="midi-dot"></span>
                <span class="midi-label" id="midi-label">MIDI</span>
            </div>
            <div class="host-diag" id="host-diag" hidden data-host-diag-state="silent" title="Host diagnostics">
                <span class="host-diag-dot"></span>
                <span id="host-diag-label">Host</span>
            </div>
            <button class="btn btn-sm" id="btn-help" title="Keyboard shortcuts (?)">?</button>
            <span id="version" class="version-badge">v0.1.0</span>
        </div>
    </header>

    <div class="main-grid">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-search">
                    <input type="search" id="global-search" placeholder="Search...">
                </div>
                <button class="btn btn-sm btn-ghost" id="tree-view-toggle" title="Tree View" style="margin:0 0.5rem 0.5rem;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px; margin-right:4px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> Tree View
                </button>
            </div>
            <ul class="sidebar-list" id="nav-list"></ul>
        </aside>

        <main class="main-content" id="main-content">
            <div class="welcome" id="panel-welcome">
                <h2>ABD Universal Bank Manager</h2>
                <p>Select a manufacturer from the sidebar to get started, or connect MIDI hardware.</p>
            </div>
            <div id="panel-content" style="display:none;"></div>
            <div class="drop-zone" id="drop-zone" style="display:none;">
                <div class="drop-zone-icon">${icons.upload}</div>
                <div class="drop-zone-text">Drop .syx, .abdbank, .abdlibrary, or .json files here</div>
                <div class="drop-zone-hint">or paste hex with Ctrl+V</div>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal-content"></div>
    </div>

    <!-- UMD bundles (loaded before modules so import map wrappers can reference globals) -->
    <script src="./jszip/jszip.min.js"></script>
    <script src="./file-saver/FileSaver.min.js"></script>

    <script type="module" src="./src/app.js"></script>
    <!-- Cache-busting: change version to force browser reload -->
    <script>/* ABDBankManager v0.1.0 */</script>
</body>
</html>
