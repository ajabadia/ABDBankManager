name: Build ABDBankManagerCore Library

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmake_generator: "Visual Studio 18 2026"
            config: Release
            artifact_name: "ABDBankManagerCore-windows-x64"
            lib_ext: ".lib"
            install_prefix: "install"
          - os: macos-latest
            cmake_generator: "Xcode"
            config: Release
            artifact_name: "ABDBankManagerCore-macos-arm64"
            lib_ext: ".a"
            install_prefix: "install"
          - os: ubuntu-latest
            cmake_generator: "Unix Makefiles"
            config: Release
            artifact_name: "ABDBankManagerCore-linux-x64"
            lib_ext: ".a"
            install_prefix: "install"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libx11-dev libxext-dev libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev libasound2-dev

      - name: Configure CMake
        run: |
          cmake -B build -S cpp \
            -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_INSTALL_PREFIX=install

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Install to local prefix
        run: cmake --install build --prefix ${{ matrix.install_prefix }} --config ${{ matrix.config }}

      - name: Package artifact
        run: |
          cd ${{ matrix.install_prefix }}
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a -tzip "${{ matrix.artifact_name }}.zip" lib include
          else
            tar -czf "${{ matrix.artifact_name }}.tar.gz" lib include
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.install_prefix }}/${{ matrix.artifact_name }}.*
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}