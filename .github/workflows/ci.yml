name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'
  # 4.4.4 exacta, y exacta a proposito. Estaba en 3.22, y 3.22 no conoce el
  # Visual Studio que trae `windows-latest`: el generador "Visual Studio 18 2026"
  # se anadio en CMake 4.2. Sin el, CMake no encuentra ninguna VS que conocer,
  # cae al primer generador que ve y elige NMake Makefiles, y como este job no
  # carga el entorno de desarrollo (`nmake` no esta en el PATH) el configure
  # moria en:
  #
  #   CMake Error at CMakeLists.txt:2 (project):
  #     Running 'nmake' '-?' failed with: The system cannot find the file specified
  #   CMake Error: CMAKE_CXX_COMPILER not set, after EnableLanguage
  #
  # que es un error de compilador que no existe: el problema era el generador.
  # `ci-lib.yml` de este mismo repo ya pedia "Visual Studio 18 2026" decia atras.
  # Un numero exacto y no un '4.4' flotante, por lo mismo que las versiones de
  # pnpm y node de ABDSharedAssets: la minima para que esto hable, y la exacta,
  # para que el job que hoy esta en verde siga siendo el mismo dentro de seis meses.
  CMAKE_VERSION: '4.4.4'

jobs:
  # --- Schema Validation ---
  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # El corte F4 movio Source/Contracts a ABDSharedCode/BankManager/Contracts:
      # los shims de Source/Contracts y el `npm run generate` (esbuild) resuelven
      # contra el hermano ../ABDSharedCode, igual que el root CMake con
      # FetchContent. Sin este paso, generate/test mueren en "Could not resolve".
      - name: Checkout ABDSharedCode (sibling)
        run: git clone --depth 1 https://github.com/ajabadia/ABDSharedCode.git ../ABDSharedCode

      - name: Generate registry
        run: npm run generate

      - name: Validate parameter registry
        run: |
          # Check for duplicate IDs
          node -e "
            const fs = require('fs');
            const registry = JSON.parse(fs.readFileSync('schemas/parameter-registry.data.json', 'utf8'));
            const ids = registry.parameters.map(p => p.id);
            const dupes = ids.filter((id, i) => ids.indexOf(id) !== i);
            if (dupes.length > 0) {
              console.error('Duplicate IDs:', dupes);
              process.exit(1);
            }
            console.log('✅ No duplicate IDs');
          "

      - name: Validate CC assignments
        run: |
          node -e "
            const fs = require('fs');
            const registry = JSON.parse(fs.readFileSync('schemas/parameter-registry.data.json', 'utf8'));
            const ccs = registry.parameters
              .filter(p => p.cc !== null && p.cc !== undefined)
              .map(p => p.cc);
            const dupes = ccs.filter((cc, i) => ccs.indexOf(cc) !== i);
            if (dupes.length > 0) {
              console.error('Duplicate CCs:', dupes);
              process.exit(1);
            }
            console.log('✅ No duplicate CCs');
          "

      - name: Validate sysex offsets
        run: |
          node -e "
            const fs = require('fs');
            const registry = JSON.parse(fs.readFileSync('schemas/parameter-registry.data.json', 'utf8'));
            const sysexParams = registry.parameters.filter(p => p.sysex);
            const offsets = sysexParams.map(p => p.sysexOffset).sort((a, b) => a - b);
            const valid = offsets.every((offset, i) => offset === i);
            if (!valid) {
              console.error('Sysex offset collision or gap:', offsets);
              process.exit(1);
            }
            console.log('✅ Sysex offsets sequential:', offsets.length);
          "

  # --- Registry Generation ---
  registry-generation:
    name: Registry Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # El corte F4 movio Source/Contracts a ABDSharedCode/BankManager/Contracts:
      # los shims de Source/Contracts y el `npm run generate` (esbuild) resuelven
      # contra el hermano ../ABDSharedCode, igual que el root CMake con
      # FetchContent. Sin este paso, generate/test mueren en "Could not resolve".
      - name: Checkout ABDSharedCode (sibling)
        run: git clone --depth 1 https://github.com/ajabadia/ABDSharedCode.git ../ABDSharedCode

      - name: Generate registry
        run: npm run generate

      - name: Verify generated artifacts exist
        run: |
          test -f Source/State/ParameterRegistry.gen.h
          test -f Source/State/ParameterRegistry.gen.cpp
          test -f WebUI/src/contracts/registry.gen.js
          test -f WebUI/src/contracts/buildVersion.js
          test -f schemas/parameter-registry.data.json
          echo "✅ All artifacts generated"

      - name: Verify generated artifacts are not empty
        run: |
          test -s Source/State/ParameterRegistry.gen.h
          test -s Source/State/ParameterRegistry.gen.cpp
          test -s WebUI/src/contracts/registry.gen.js
          echo "✅ Artifacts have content"

  # --- WebUI Tests ---
  vitest:
    name: WebUI Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # El corte F4 movio Source/Contracts a ABDSharedCode/BankManager/Contracts:
      # los shims de Source/Contracts y el `npm run generate` (esbuild) resuelven
      # contra el hermano ../ABDSharedCode, igual que el root CMake con
      # FetchContent. Sin este paso, generate/test mueren en "Could not resolve".
      - name: Checkout ABDSharedCode (sibling)
        run: git clone --depth 1 https://github.com/ajabadia/ABDSharedCode.git ../ABDSharedCode

      - name: Verify installed tree matches manifests
        run: npm run verificar:entorno

      - name: Generate registry
        run: npm run generate

      - name: Run Vitest
        run: npm test

  # --- C++ Unit Tests (Windows) ---
  cpp-unit-tests:
    name: C++ Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # ANTES ERA `git submodule update --init --recursive`, y no hacia nada. Este
      # repo declara el submodulo en .gitmodules pero el indice no tiene el
      # gitlink, asi que ese comando sale con 0 y GITS/JUCE sigue sin existir:
      # un paso que parece instalar JUCE y no lo instala es peor que no tenerlo.
      # Medido en un clon limpio. El porque entero esta en
      # .github/actions/juce/action.yml.
      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          version: '9.0.1'
          sha: 'e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8'

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run C++ Tests
        run: |
          $testExe = Get-ChildItem -Path build -Filter "*Tests*" -Recurse | Where-Object { $_.Extension -eq '.exe' }
          if ($testExe) {
            & $testExe.FullName
          } else {
            Write-Warning "No test executable found"
          }

  # --- Linux CMake + VST3 + pluginval (guard del bug de mayusculas) ---
  # El guard contra el bug de mayusculas: el root CMakeLists invocaba
  # `Scripts/build_webui.js` con S mayuscula y el directorio real es
  # `scripts/`. En Windows (todos los demas jobs que compilan) da igual; en un
  # FS case-sensitive CUALQUIER build de Linux revienta en cuanto GenerateAll
  # corre node. Medido: asi rompio el job WASM (retirado mas abajo) y asi
  # quedaria rojo cualquier regresion igual.
  #
  # POR QUE CONFIGURA EL ROOT Y NO `cpp/`: solo el root declara los custom
  # targets GenerateBuildVersion/GenerateRegistry con la ruta de los scripts
  # — que es exactamente donde vivia el bug. `cmake -S cpp` (lo que hace
  # ci-lib.yml) no los ejecuta y no lo pillaria nunca.
  #
  # EVOLUCION (2026-10-06): la version inicial configuraba con
  # -DABDBANKMANAGER_BUILD_PLUGIN=OFF para no arrastrar el SDK VST3 a un guard
  # barato. Hoy el job hace mas: ademas de GenerateAll y los tests C++ compila
  # el VST3 en Ubuntu (JUCE trae el SDK VST3 vendorizado, no hay descarga) y
  # lo pasa por pluginval — v1.0.4, strictness 10, la MISMA bateria que el job
  # pluginval de Windows— para que los dos sistemas sean comparables. La
  # opcion OFF se queda como escape hatch documentado en CMakeLists.txt; este
  # job ya no la usa.
  linux-cmake-core:
    name: Linux CMake + VST3 + pluginval (guard de mayusculas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Paquetes de sistema para compilar JUCE en Linux — los de ci-lib.yml
      # y dos mas, ambos MEDIDOS en los dos intentos previos de este job:
      #   - libfontconfig1-dev, medido: sin el, el check combinado
      #     `pkg freetype2;fontconfig` de JUCE falla por fontconfig, el
      #     ImportedTarget no se crea, juce_graphics compila sin
      #     -I/usr/include/freetype2 y juceaide (que se construye en el propio
      #     configure) revienta con "fatal error: ft2build.h: No such file or
      #     directory".
      #   - libcurl4-openssl-dev, medido: juce_core.cpp incluye curl/curl.h en
      #     Linux (JUCE_USE_CURL=1 por defecto alla) y ABDShared_HardwareDrivers
      #     lo compila dentro del grafo del test.
      #   - libgtk-3-dev + libwebkit2gtk-4.1-dev, medido: WebView2Bridge llega
      #     al test via juce_gui_extra, JUCE_WEB_BROWSER=1 por defecto en
      #     Linux, y juce_gui_extra.cpp incluye gtk/gtk.h y webkit2/webkit2.h
      #     con los flags del pkg que JUCE sondea (webkit2gtk-4.1 primero,
      #     4.0 despues — en noble solo existe 4.1).
      # ALSA y las libs X11 van por juce_audio_devices y juce_gui_extra.
      # xvfb va en la lista: pluginval en Linux abre el editor del plugin y
      # en el runner no hay display — xvfb-run lo corge bajo un framebuffer
      # virtual, que es como corren los validations de pluginval en CI.
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libfontconfig1-dev libcurl4-openssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev libxext-dev libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev libasound2-dev xvfb

      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          version: '9.0.1'
          sha: 'e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8'

      # Con el plugin (default ON): hace falta para compilar el VST3 mas
      # abajo. El guard de mayusculas no cambia: GenerateAll se declara en el
      # root y se ejecuta en el primer paso de build sea cual sea el valor.
      - name: Configure CMake (root, con plugin)
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      # Dos pasos a proposito. El primero ES el guard: GenerateAll corre
      # node sobre scripts/build_webui.js y scripts/registry_generator.js
      # con la ruta que declare el root CMakeLists, y en un FS case-sensitive
      # un `Scripts/` vuelve a morir aqui con "Cannot find module". El
      # segundo compila el nucleo y los tests C++ (ABDBankManagerCore arrastra
      # GenerateAll por add_dependencies, ABDSharedCode por FetchContent y
      # los modulos compartidos que consume).
      - name: Build (GenerateAll + ABDBankManagerCoreTests)
        run: |
          cmake --build build --parallel --target GenerateAll
          cmake --build build --parallel --target ABDBankManagerCoreTests

      # Compilar no basta: el binario tiene que CORRER en Linux. ctest recoge
      # ABDBankManagerCoreTests (el unico add_test del grafo: los tests de
      # ABDSharedCode estan apagados con ABDSHAREDCODE_BUILD_*_TESTS=OFF en el
      # root) y su exit code es el del paso. --output-on-failure: callado en
      # verde, con el volcado completo en rojo. Los windows ya los corría el
      # job C++ Unit Tests; esto mide el mismo binario en el otro sistema.
      - name: Run C++ Tests
        run: ctest --test-dir build --output-on-failure

      # El VST3 en Ubuntu. El target es el que JUCE crea por formato
      # (<Plugin>_VST3); el SDK de Steinberg lo trae el propio JUCE vendorizado
      # en modules/juce_audio_processors/format_types/VST3_SDK, no hay red.
      - name: Build VST3 plugin
        run: cmake --build build --parallel --target ABDBankManagerPlugin_VST3

      # pluginval IGUAL que en Windows: misma version (v1.0.4, fijada) y mismo
      # strictness 10, asi el par de jobs es una comparacion de verdad y no dos
      # cosas distintas con el mismo nombre. El find evita el nombre con
      # espacios del artefacto ("ABD Bank Manager Plugin.vst3"); test -n
      # falla el paso si el .vst3 no existe en vez de validar un vacio.
      - name: Install pluginval
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pluginval.zip" https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q "$RUNNER_TEMP/pluginval.zip" -d "$RUNNER_TEMP/pluginval"
          chmod +x "$RUNNER_TEMP"/pluginval/pluginval

      - name: Run pluginval (strictness 10)
        run: |
          vst3=$(find build -name '*.vst3' -type d | head -1)
          test -n "$vst3"
          xvfb-run -a "$RUNNER_TEMP/pluginval/pluginval" --strictness-level 10 --validate "$vst3"

      # El .vst3 que pluginval acabo de aprobar, subido como artifact para
      # poder bajarlo y probarlo en local. El bundle se COPIA a un dir aparte
      # antes de subirlo: upload-artifact usa como raiz el ancestro comun de
      # lo que sube, y si se subiera el bundle directamente el artifact
      # saldria Contents/ suelto — sin la carpeta "ABD Bank Manager Plugin.vst3"
      # que hace falta para instalarlo. Encadenado detras de pluginval: si la
      # validacion falla, el paso no corre y no se sube un binario no validado.
      - name: Stage validated VST3
        run: |
          vst3=$(find build -name '*.vst3' -type d | head -1)
          test -n "$vst3"
          mkdir -p "$RUNNER_TEMP/vst3-upload"
          cp -R "$vst3" "$RUNNER_TEMP/vst3-upload/"

      # if-no-files-found: error: un build que no produce el bundle falla aqui
      # en vez de subir un artifact vacio en silencio. 30 dias, como en ci-lib.
      - name: Upload validated VST3 (Linux)
        uses: actions/upload-artifact@v7
        with:
          name: ABDMS2000-vst3-linux
          path: ${{ runner.temp }}/vst3-upload
          if-no-files-found: error
          retention-days: 30

  # --- WASM Build: RETIRADO el 2026-10-06 (decision documentada) ---
  #
  # El job existio y estuvo rojo semanas con continue-on-error — la peor
  # combinacion posible: un rojo que nadie mira. Antes de retirarlo se
  # intento arreglarlo de verdad, y esto es lo que se midio (2026-10-06,
  # contra el pin 9.0.1 = e18f7f5 y el ultimo release, 9.0.3):
  #
  #   1. No hay NINGUN target wasm en el proyecto (README: WASM AudioWorklet
  #      — Planned), asi que el job compilaba el arbol entero bajo emscripten
  #      sin producir ningun artefacto que consuma nadie. Un verde ahi no
  #      verificaria nada, y sin target tampoco hay nada que arreglar.
  #   2. Este arbol no puede compilar bajo emscripten con JUCE, ni en 9.0.1
  #      ni en 9.0.3 (medido sobre el repo oficial: CERO commits
  #      wasm/emscripten entre ambos tags, y los dos ficheros que fallan sin
  #      ningun cambio): juce_ThreadPriorities_native.h no tiene rama
  #      JUCE_WASM (la tabla sale vacia y el compilador revienta en
  #      std::size), juce_SystemStats_wasm.cpp llama a emscripten_get_now sin
  #      incluir emscripten.h, y juce_audio_devices / juce_events no tienen
  #      NINGUNA ruta wasm — y el core del proyecto los enlaza.
  #   3. Arreglar eso exigiria parchear modulos de JUCE aqui (o mantener un
  #      fork) para un target que no existe. Eso no es arreglar un job: es
  #      empezar un puerto de plataforma con un consumidor imaginario.
  #
  # DOS ARREGLOS REALES SALIERON DEL INTENTO y se quedan:
  #   - El root CMakeLists invocaba `Scripts/...` con mayusculas; en un FS
  #     case-sensitive (Linux) node no encontraba build_webui.js ni
  #     registry_generator.js. Eso rompia CUALQUIER build en Linux, no solo
  #     este job.
  #   - add_subdirectory(apps/juce-plugin) quedo bajo `if(NOT EMSCRIPTEN)` en
  #     el root CMakeLists: el plugin es nativo (VST3/WebView2) y bajo
  #     emscripten moriria en el SDK VST3 de Steinberg (medido: fununknown.h
  #     revienta en PLUGIN_API).
  #
  # CRITERIO DE RE-ENTRADA: anadir el job de nuevo el dia que (a) exista un
  # target wasm real que produzca un artefacto verificable, y (b) el JUCE
  # fijado compile ese arbol bajo emscripten sin parches nuestros. (b) se
  # comprueba en un minuto: `git log -i --grep=wasm <pin>..<tag>` en el repo
  # de JUCE oficial y un `emcmake cmake && cmake --build` de prueba. El README
  # no cambia: WASM AudioWorklet sigue siendo Planned.
  #

  # --- Plugin Validation ---
  pluginval:
    name: Plugin Validation (pluginval)
    runs-on: windows-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # Este paso era `git submodule update --init --recursive`, un no-op: el
      # .gitmodules declara el submodulo pero el indice no tiene el gitlink, asi
      # que salia con 0 sin bajar nada. Ver .github/actions/juce/action.yml.
      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          version: '9.0.1'
          sha: 'e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8'

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin
        run: cmake --build build --config Release --parallel

      # pluginval DE VERDAD — este job era un echo (el ROADMAP lo listaba
      # como stub). Version y strictness fijados identicos al job de Linux
      # (v1.0.4 / 10) para que los dos jobs sean comparables: mismo validator,
      # misma bateria, distinta plataforma. shell: bash en los dos pasos
      # porque find/unzip no son comandos de PowerShell.
      - name: Install pluginval
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pluginval.zip" https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          unzip -q "$RUNNER_TEMP/pluginval.zip" -d "$RUNNER_TEMP/pluginval"

      - name: Run pluginval
        shell: bash
        run: |
          vst3=$(find build -name '*.vst3' -type d | head -1)
          test -n "$vst3"
          "$RUNNER_TEMP/pluginval/pluginval.exe" --strictness-level 10 --validate "$vst3"

      # Mismo rationale que en Linux: copiar el bundle antes de subirlo para
      # que el artifact traiga la carpeta "*.vst3" completa instalable, y solo
      # si pluginval (arriba) salio verde. shell: bash: find/cp no son
      # comandos de PowerShell.
      - name: Stage validated VST3
        shell: bash
        run: |
          vst3=$(find build -name '*.vst3' -type d | head -1)
          test -n "$vst3"
          mkdir -p "$RUNNER_TEMP/vst3-upload"
          cp -R "$vst3" "$RUNNER_TEMP/vst3-upload/"

      - name: Upload validated VST3 (Windows)
        uses: actions/upload-artifact@v7
        with:
          name: ABDMS2000-vst3-windows
          path: ${{ runner.temp }}/vst3-upload
          if-no-files-found: error
          retention-days: 30

  # --- Allocation Audit ---
  allocation-audit:
    name: Allocation Audit
    runs-on: windows-latest
    # Red de seguridad: un exe instrumentado que se cuelgue no debe quedarse
    # ocupando un runner hasta agotar las 6 h.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # Este paso era `git submodule update --init --recursive`, un no-op: el
      # .gitmodules declara el submodulo pero el indice no tiene el gitlink, asi
      # que salia con 0 sin bajar nada. Ver .github/actions/juce/action.yml.
      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          version: '9.0.1'
          sha: 'e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8'

      - name: Configure CMake with sanitizers
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="/fsanitize=address /EHsc /Zi /INCREMENTAL:NO"

      - name: Build with ASan
        run: cmake --build build --config Debug --parallel

      - name: Run tests with ASan
        run: |
          # El ASan de MSVC no implementa detect_leaks, solo en Linux.
          $env:ASAN_OPTIONS = "halt_on_error=1"
          $testExe = Get-ChildItem -Path build -Filter "*Tests*" -Recurse |
            Where-Object { $_.Extension -eq '.exe' } |
            Sort-Object FullName -Unique
          if (-not $testExe) {
            Write-Error "No se encontro ningun ejecutable de test en build/"
            exit 1
          }

          # Un exe instrumentado depende de clang_rt.asan_dynamic-x86_64.dll,
          # que MSVC no copia al directorio de salida: sin ella el proceso
          # muere con 0xC0000135. Y tiene que ser la de la MISMA version que
          # el cl.exe que compilo el build: el runner tiene varias versiones de
          # las herramientas instaladas y con la que no toca el proceso se
          # queda colgado en vez de reportar nada.
          $compilerCache = Get-ChildItem -Path build -Filter "CMakeCXXCompiler.cmake" `
            -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compilerCache) {
            Write-Error "No se encontro CMakeCXXCompiler.cmake en build/"
            exit 1
          }
          $compilerLine = Select-String -Path $compilerCache.FullName `
            -Pattern 'CMAKE_CXX_COMPILER\s+"([^"]+)"' | Select-Object -First 1
          if (-not $compilerLine) {
            Write-Error "No se pudo leer CMAKE_CXX_COMPILER de $($compilerCache.FullName)"
            exit 1
          }
          $compilerPath = $compilerLine.Matches[0].Groups[1].Value -replace '/', '\'
          # La DLL vive en la misma carpeta que cl.exe, no un nivel arriba.
          $toolBin = Split-Path $compilerPath -Parent
          $asanDll = Join-Path $toolBin "clang_rt.asan_dynamic-x86_64.dll"
          if (-not (Test-Path $asanDll)) {
            Write-Error "No existe $asanDll; el runtime de ASan debe ir junto al compilador"
            exit 1
          }
          Write-Host "Compilador: $compilerPath"
          Write-Host "Runtime de ASan: $asanDll"
          foreach ($exe in $testExe) {
            Copy-Item $asanDll -Destination $exe.DirectoryName -Force
          }

          $timeoutSeconds = 300
          foreach ($exe in $testExe) {
            Write-Host "Ejecutando $($exe.FullName)"
            $outLog = Join-Path $env:RUNNER_TEMP ("asan-" + $exe.BaseName + ".log")
            $proc = Start-Process -FilePath $exe.FullName -PassThru -NoNewWindow `
              -RedirectStandardOutput $outLog -RedirectStandardError "$outLog.err"
            $finished = $proc.WaitForExit($timeoutSeconds * 1000)
            if (-not $finished) {
              try { $proc.Kill() } catch {}
            }
            # Volcar siempre: si el proceso se queda colgado, esto dice hasta
            # donde llego, y si falla, por que.
            foreach ($log in @($outLog, "$outLog.err")) {
              if (Test-Path $log) {
                Write-Host "--- $([System.IO.Path]::GetFileName($log)) ---"
                Get-Content $log | Write-Host
              }
            }
            if (-not $finished) {
              Write-Error "$($exe.Name) sigue vivo tras $timeoutSeconds s con ASan; se ha parado el proceso"
              exit 1
            }
            if ($proc.ExitCode -ne 0) {
              Write-Error "$($exe.Name) termino con codigo $($proc.ExitCode)"
              exit $proc.ExitCode
            }
            Write-Host "$($exe.Name): correcto"
          }

  # --- Security Scan ---
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Check for known vulnerabilities
        run: |
          npx audit-ci --config audit-ci.json || true

  # --- Build Verification ---
  build-verification:
    name: Build Verification
    runs-on: windows-latest
    needs: [schema-validation, registry-generation, vitest, cpp-unit-tests]
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # Este paso era `git submodule update --init --recursive`, un no-op: el
      # .gitmodules declara el submodulo pero el indice no tiene el gitlink, asi
      # que salia con 0 sin bajar nada. Ver .github/actions/juce/action.yml.
      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          version: '9.0.1'
          sha: 'e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8'

      - name: Full Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      # El nucleo es STATIC (cpp/CMakeLists.txt) y el plugin se llama "ABD Bank
      # Manager Plugin" con espacios: el build por defecto no produce NINGUN
      # fichero *BankManager*.dll, asi que este check no podía pasar nunca. No
      # habia saltado porque el job `needs` a vitest, que llevaba rojo. Se
      # verifica lo que el build si debe producir: la libreria del core y el
      # binario de tests (que ademas ejecuta el job cpp-unit-tests).
      - name: Verify outputs
        run: |
          $lib = Get-ChildItem -Path build -Filter "ABDBankManagerCore.lib" -Recurse
          $tests = Get-ChildItem -Path build -Filter "ABDBankManagerCoreTests.exe" -Recurse
          if ($lib -and $tests) {
            Write-Host "✅ ABDBankManagerCore.lib and ABDBankManagerCoreTests.exe found"
          } else {
            Write-Error "Missing build outputs (ABDBankManagerCore.lib / ABDBankManagerCoreTests.exe)"
            exit 1
          }

  # --- Release ---
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-verification]
    steps:
      - uses: actions/checkout@v7

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/*.dll
            build/*.lib
          generate_release_notes: true