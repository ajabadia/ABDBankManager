name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'
  # 4.4.4 exacta, y exacta a proposito. Estaba en 3.22, y 3.22 no conoce el
  # Visual Studio que trae `windows-latest`: el generador "Visual Studio 18 2026"
  # se anadio en CMake 4.2. Sin el, CMake no encuentra ninguna VS que conocer,
  # cae al primer generador que ve y elige NMake Makefiles, y como este job no
  # carga el entorno de desarrollo (`nmake` no esta en el PATH) el configure
  # moria en:
  #
  #   CMake Error at CMakeLists.txt:2 (project):
  #     Running 'nmake' '-?' failed with: The system cannot find the file specified
  #   CMake Error: CMAKE_CXX_COMPILER not set, after EnableLanguage
  #
  # que es un error de compilador que no existe: el problema era el generador.
  # `ci-lib.yml` de este mismo repo ya pedia "Visual Studio 18 2026" decia atras.
  # Un numero exacto y no un '4.4' flotante, por lo mismo que las versiones de
  # pnpm y node de ABDSharedAssets: la minima para que esto hable, y la exacta,
  # para que el job que hoy esta en verde siga siendo el mismo dentro de seis meses.
  CMAKE_VERSION: '4.4.4'

jobs:
  # --- Schema Validation ---
  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate registry
        run: npm run generate

      - name: Validate parameter registry
        run: |
          # Check for duplicate IDs
          node -e "
            const fs = require('fs');
            const registry = JSON.parse(fs.readFileSync('schemas/parameter-registry.data.json', 'utf8'));
            const ids = registry.parameters.map(p => p.id);
            const dupes = ids.filter((id, i) => ids.indexOf(id) !== i);
            if (dupes.length > 0) {
              console.error('Duplicate IDs:', dupes);
              process.exit(1);
            }
            console.log('✅ No duplicate IDs');
          "

      - name: Validate CC assignments
        run: |
          node -e "
            const fs = require('fs');
            const registry = JSON.parse(fs.readFileSync('schemas/parameter-registry.data.json', 'utf8'));
            const ccs = registry.parameters
              .filter(p => p.cc !== null && p.cc !== undefined)
              .map(p => p.cc);
            const dupes = ccs.filter((cc, i) => ccs.indexOf(cc) !== i);
            if (dupes.length > 0) {
              console.error('Duplicate CCs:', dupes);
              process.exit(1);
            }
            console.log('✅ No duplicate CCs');
          "

      - name: Validate sysex offsets
        run: |
          node -e "
            const fs = require('fs');
            const registry = JSON.parse(fs.readFileSync('schemas/parameter-registry.data.json', 'utf8'));
            const sysexParams = registry.parameters.filter(p => p.sysex);
            const offsets = sysexParams.map(p => p.sysexOffset).sort((a, b) => a - b);
            const valid = offsets.every((offset, i) => offset === i);
            if (!valid) {
              console.error('Sysex offset collision or gap:', offsets);
              process.exit(1);
            }
            console.log('✅ Sysex offsets sequential:', offsets.length);
          "

  # --- Registry Generation ---
  registry-generation:
    name: Registry Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate registry
        run: npm run generate

      - name: Verify generated artifacts exist
        run: |
          test -f Source/State/ParameterRegistry.gen.h
          test -f Source/State/ParameterRegistry.gen.cpp
          test -f WebUI/src/contracts/registry.gen.js
          test -f WebUI/src/contracts/buildVersion.js
          test -f schemas/parameter-registry.data.json
          echo "✅ All artifacts generated"

      - name: Verify generated artifacts are not empty
        run: |
          test -s Source/State/ParameterRegistry.gen.h
          test -s Source/State/ParameterRegistry.gen.cpp
          test -s WebUI/src/contracts/registry.gen.js
          echo "✅ Artifacts have content"

  # --- WebUI Tests ---
  vitest:
    name: WebUI Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify installed tree matches manifests
        run: npm run verificar:entorno

      - name: Generate registry
        run: npm run generate

      - name: Run Vitest
        run: npm test

  # --- C++ Unit Tests (Windows) ---
  cpp-unit-tests:
    name: C++ Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # ANTES ERA `git submodule update --init --recursive`, y no hacia nada. Este
      # repo declara el submodulo en .gitmodules pero el indice no tiene el
      # gitlink, asi que ese comando sale con 0 y GITS/JUCE sigue sin existir:
      # un paso que parece instalar JUCE y no lo instala es peor que no tenerlo.
      # Medido en un clon limpio. El porque entero esta en
      # .github/actions/juce/action.yml.
      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          version: '9.0.1'
          sha: 'e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8'

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run C++ Tests
        run: |
          $testExe = Get-ChildItem -Path build -Filter "*Tests*" -Recurse | Where-Object { $_.Extension -eq '.exe' }
          if ($testExe) {
            & $testExe.FullName
          } else {
            Write-Warning "No test executable found"
          }

  # --- WASM Build ---
  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    # Falla por un bug de JUCE 8.0.4, no por codigo del proyecto: en
    # juce_PropertiesFile.cpp la variable dir se declara solo dentro de las
    # ramas JUCE_LINUX, JUCE_WINDOWS y JUCE_APPLE, y emscripten no define
    # ninguna, con lo que "dir" sale como undeclared identifier. El proyecto
    # aun no define ningun target wasm (el README lo lista como Planned), asi
    # que este job no puede pasar hasta que exista. continue-on-error deja el
    # rojo a la vista sin bloquear la rama.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: '3.1.50'
          actions-cache-folder: 'emsdk-cache'

      # ESTE JOB NO TENIA NINGUN PASO DE JUCE, y por eso moria antes que los
      # otros: los de Windows tenian un "Install JUCE" que no instalaba nada,
      # y este no tenia ni el paso inútil. Los cuatro caian en el mismo sitio,
      # por el mismo motivo, en `find_package(JUCE 8 REQUIRED CONFIG)`.
      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          version: '9.0.1'
          sha: 'e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8'

      - name: Install X11 headers
        run: |
          # juceaide es una herramienta nativa que JUCE compila durante el
          # configure, y en Linux linka contra X11. Sin esto el configure
          # muere en "fatal error: X11/Xlib.h: No such file or directory".
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libasound2-dev libfreetype6-dev libcurl4-openssl-dev libglib2.0-dev libfontconfig1-dev pkg-config

      - name: Configure WASM CMake
        run: |
          source $EMSDK/emsdk_env.sh
          emcmake cmake -B build-wasm -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build WASM
        run: |
          source $EMSDK/emsdk_env.sh
          cmake --build build-wasm --config Release --parallel

  # --- Plugin Validation ---
  pluginval:
    name: Plugin Validation (pluginval)
    runs-on: windows-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # Este paso era `git submodule update --init --recursive`, un no-op: el
      # .gitmodules declara el submodulo pero el indice no tiene el gitlink, asi
      # que salia con 0 sin bajar nada. Ver .github/actions/juce/action.yml.
      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          version: '9.0.1'
          sha: 'e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8'

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin
        run: cmake --build build --config Release --parallel

      - name: Install pluginval
        run: |
          # pluginval installation would go here
          # For now, skip if not available
          echo "pluginval step - would run pluginval --strictness-level 5"

      # - name: Run pluginval
      #   run: |
      #     $pluginPath = Get-ChildItem -Path build -Filter "*.vst3" -Recurse | Select-Object -First 1
      #     if ($pluginPath) {
      #       pluginval --strictness-level 5 --validate $pluginPath.FullName
      #     }

  # --- Allocation Audit ---
  allocation-audit:
    name: Allocation Audit
    runs-on: windows-latest
    # Red de seguridad: un exe instrumentado que se cuelgue no debe quedarse
    # ocupando un runner hasta agotar las 6 h.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # Este paso era `git submodule update --init --recursive`, un no-op: el
      # .gitmodules declara el submodulo pero el indice no tiene el gitlink, asi
      # que salia con 0 sin bajar nada. Ver .github/actions/juce/action.yml.
      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          version: '9.0.1'
          sha: 'e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8'

      - name: Configure CMake with sanitizers
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="/fsanitize=address /EHsc /Zi /INCREMENTAL:NO"

      - name: Build with ASan
        run: cmake --build build --config Debug --parallel

      - name: Run tests with ASan
        run: |
          # El ASan de MSVC no implementa detect_leaks, solo en Linux.
          $env:ASAN_OPTIONS = "halt_on_error=1"
          $testExe = Get-ChildItem -Path build -Filter "*Tests*" -Recurse |
            Where-Object { $_.Extension -eq '.exe' } |
            Sort-Object FullName -Unique
          if (-not $testExe) {
            Write-Error "No se encontro ningun ejecutable de test en build/"
            exit 1
          }

          # Un exe instrumentado depende de clang_rt.asan_dynamic-x86_64.dll,
          # que MSVC no copia al directorio de salida: sin ella el proceso
          # muere con 0xC0000135. Y tiene que ser la de la MISMA version que
          # el cl.exe que compilo el build: el runner tiene varias versiones de
          # las herramientas instaladas y con la que no toca el proceso se
          # queda colgado en vez de reportar nada.
          $compilerCache = Get-ChildItem -Path build -Filter "CMakeCXXCompiler.cmake" `
            -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compilerCache) {
            Write-Error "No se encontro CMakeCXXCompiler.cmake en build/"
            exit 1
          }
          $compilerLine = Select-String -Path $compilerCache.FullName `
            -Pattern 'CMAKE_CXX_COMPILER\s+"([^"]+)"' | Select-Object -First 1
          if (-not $compilerLine) {
            Write-Error "No se pudo leer CMAKE_CXX_COMPILER de $($compilerCache.FullName)"
            exit 1
          }
          $compilerPath = $compilerLine.Matches[0].Groups[1].Value -replace '/', '\'
          # La DLL vive en la misma carpeta que cl.exe, no un nivel arriba.
          $toolBin = Split-Path $compilerPath -Parent
          $asanDll = Join-Path $toolBin "clang_rt.asan_dynamic-x86_64.dll"
          if (-not (Test-Path $asanDll)) {
            Write-Error "No existe $asanDll; el runtime de ASan debe ir junto al compilador"
            exit 1
          }
          Write-Host "Compilador: $compilerPath"
          Write-Host "Runtime de ASan: $asanDll"
          foreach ($exe in $testExe) {
            Copy-Item $asanDll -Destination $exe.DirectoryName -Force
          }

          $timeoutSeconds = 300
          foreach ($exe in $testExe) {
            Write-Host "Ejecutando $($exe.FullName)"
            $outLog = Join-Path $env:RUNNER_TEMP ("asan-" + $exe.BaseName + ".log")
            $proc = Start-Process -FilePath $exe.FullName -PassThru -NoNewWindow `
              -RedirectStandardOutput $outLog -RedirectStandardError "$outLog.err"
            $finished = $proc.WaitForExit($timeoutSeconds * 1000)
            if (-not $finished) {
              try { $proc.Kill() } catch {}
            }
            # Volcar siempre: si el proceso se queda colgado, esto dice hasta
            # donde llego, y si falla, por que.
            foreach ($log in @($outLog, "$outLog.err")) {
              if (Test-Path $log) {
                Write-Host "--- $([System.IO.Path]::GetFileName($log)) ---"
                Get-Content $log | Write-Host
              }
            }
            if (-not $finished) {
              Write-Error "$($exe.Name) sigue vivo tras $timeoutSeconds s con ASan; se ha parado el proceso"
              exit 1
            }
            if ($proc.ExitCode -ne 0) {
              Write-Error "$($exe.Name) termino con codigo $($proc.ExitCode)"
              exit $proc.ExitCode
            }
            Write-Host "$($exe.Name): correcto"
          }

  # --- Security Scan ---
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Check for known vulnerabilities
        run: |
          npx audit-ci --config audit-ci.json || true

  # --- Build Verification ---
  build-verification:
    name: Build Verification
    runs-on: windows-latest
    needs: [schema-validation, registry-generation, vitest, cpp-unit-tests]
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # Este paso era `git submodule update --init --recursive`, un no-op: el
      # .gitmodules declara el submodulo pero el indice no tiene el gitlink, asi
      # que salia con 0 sin bajar nada. Ver .github/actions/juce/action.yml.
      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          version: '9.0.1'
          sha: 'e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8'

      - name: Full Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      # El nucleo es STATIC (cpp/CMakeLists.txt) y el plugin se llama "ABD Bank
      # Manager Plugin" con espacios: el build por defecto no produce NINGUN
      # fichero *BankManager*.dll, asi que este check no podía pasar nunca. No
      # habia saltado porque el job `needs` a vitest, que llevaba rojo. Se
      # verifica lo que el build si debe producir: la libreria del core y el
      # binario de tests (que ademas ejecuta el job cpp-unit-tests).
      - name: Verify outputs
        run: |
          $lib = Get-ChildItem -Path build -Filter "ABDBankManagerCore.lib" -Recurse
          $tests = Get-ChildItem -Path build -Filter "ABDBankManagerCoreTests.exe" -Recurse
          if ($lib -and $tests) {
            Write-Host "✅ ABDBankManagerCore.lib and ABDBankManagerCoreTests.exe found"
          } else {
            Write-Error "Missing build outputs (ABDBankManagerCore.lib / ABDBankManagerCoreTests.exe)"
            exit 1
          }

  # --- Release ---
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-verification]
    steps:
      - uses: actions/checkout@v7

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/*.dll
            build/*.lib
          generate_release_notes: true