name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'
  # 4.4.4 exacta, y exacta a proposito. Estaba en 3.22, y 3.22 no conoce el
  # Visual Studio que trae `windows-latest`: el generador "Visual Studio 18 2026"
  # se anadio en CMake 4.2. Sin el, CMake no encuentra ninguna VS que conocer,
  # cae al primer generador que ve y elige NMake Makefiles, y como este job no
  # carga el entorno de desarrollo (`nmake` no esta en el PATH) el configure
  # moria en:
  #
  #   CMake Error at CMakeLists.txt:2 (project):
  #     Running 'nmake' '-?' failed with: The system cannot find the file specified
  #   CMake Error: CMAKE_CXX_COMPILER not set, after EnableLanguage
  #
  # que es un error de compilador que no existe: el problema era el generador.
  # `ci-lib.yml` de este mismo repo ya pedia "Visual Studio 18 2026" decia atras.
  # Un numero exacto y no un '4.4' flotante, por lo mismo que las versiones de
  # pnpm y node de ABDSharedAssets: la minima para que esto hable, y la exacta,
  # para que el job que hoy esta en verde siga siendo el mismo dentro de seis meses.
  CMAKE_VERSION: '4.4.4'

jobs:
  # --- Schema Validation ---
  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate registry
        run: npm run generate

      - name: Validate parameter registry
        run: |
          # Check for duplicate IDs
          node -e "
            const fs = require('fs');
            const registry = JSON.parse(fs.readFileSync('schemas/parameter-registry.data.json', 'utf8'));
            const ids = registry.parameters.map(p => p.id);
            const dupes = ids.filter((id, i) => ids.indexOf(id) !== i);
            if (dupes.length > 0) {
              console.error('Duplicate IDs:', dupes);
              process.exit(1);
            }
            console.log('✅ No duplicate IDs');
          "

      - name: Validate CC assignments
        run: |
          node -e "
            const fs = require('fs');
            const registry = JSON.parse(fs.readFileSync('schemas/parameter-registry.data.json', 'utf8'));
            const ccs = registry.parameters
              .filter(p => p.cc !== null && p.cc !== undefined)
              .map(p => p.cc);
            const dupes = ccs.filter((cc, i) => ccs.indexOf(cc) !== i);
            if (dupes.length > 0) {
              console.error('Duplicate CCs:', dupes);
              process.exit(1);
            }
            console.log('✅ No duplicate CCs');
          "

      - name: Validate sysex offsets
        run: |
          node -e "
            const fs = require('fs');
            const registry = JSON.parse(fs.readFileSync('schemas/parameter-registry.data.json', 'utf8'));
            const sysexParams = registry.parameters.filter(p => p.sysex);
            const offsets = sysexParams.map(p => p.sysexOffset).sort((a, b) => a - b);
            const valid = offsets.every((offset, i) => offset === i);
            if (!valid) {
              console.error('Sysex offset collision or gap:', offsets);
              process.exit(1);
            }
            console.log('✅ Sysex offsets sequential:', offsets.length);
          "

  # --- Registry Generation ---
  registry-generation:
    name: Registry Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate registry
        run: npm run generate

      - name: Verify generated artifacts exist
        run: |
          test -f Source/State/ParameterRegistry.gen.h
          test -f Source/State/ParameterRegistry.gen.cpp
          test -f WebUI/src/contracts/registry.gen.js
          test -f WebUI/src/contracts/buildVersion.js
          test -f schemas/parameter-registry.data.json
          echo "✅ All artifacts generated"

      - name: Verify generated artifacts are not empty
        run: |
          test -s Source/State/ParameterRegistry.gen.h
          test -s Source/State/ParameterRegistry.gen.cpp
          test -s WebUI/src/contracts/registry.gen.js
          echo "✅ Artifacts have content"

  # --- WebUI Tests ---
  vitest:
    name: WebUI Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify installed tree matches manifests
        run: npm run verificar:entorno

      - name: Generate registry
        run: npm run generate

      - name: Run Vitest
        run: npm test

  # --- C++ Unit Tests (Windows) ---
  cpp-unit-tests:
    name: C++ Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # ANTES ERA `git submodule update --init --recursive`, y no hacia nada. Este
      # repo declara el submodulo en .gitmodules pero el indice no tiene el
      # gitlink, asi que ese comando sale con 0 y GITS/JUCE sigue sin existir:
      # un paso que parece instalar JUCE y no lo instala es peor que no tenerlo.
      # Medido en un clon limpio. El porque entero esta en
      # .github/actions/juce/action.yml.
      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          ref: '8.0.4'

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run C++ Tests
        run: |
          $testExe = Get-ChildItem -Path build -Filter "*Tests*" -Recurse | Where-Object { $_.Extension -eq '.exe' }
          if ($testExe) {
            & $testExe.FullName
          } else {
            Write-Warning "No test executable found"
          }

  # --- WASM Build ---
  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: '3.1.50'
          actions-cache-folder: 'emsdk-cache'

      # ESTE JOB NO TENIA NINGUN PASO DE JUCE, y por eso moria antes que los
      # otros: los de Windows tenian un "Install JUCE" que no instalaba nada,
      # y este no tenia ni el paso inútil. Los cuatro caian en el mismo sitio,
      # por el mismo motivo, en `find_package(JUCE 8 REQUIRED CONFIG)`.
      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          ref: '8.0.4'

      - name: Install X11 headers
        run: |
          # juceaide es una herramienta nativa que JUCE compila durante el
          # configure, y en Linux linka contra X11. Sin esto el configure
          # muere en "fatal error: X11/Xlib.h: No such file or directory".
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libasound2-dev libfreetype6-dev libcurl4-openssl-dev libglib2.0-dev

      - name: Configure WASM CMake
        run: |
          source $EMSDK/emsdk_env.sh
          emcmake cmake -B build-wasm -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build WASM
        run: |
          source $EMSDK/emsdk_env.sh
          cmake --build build-wasm --config Release --parallel

  # --- Plugin Validation ---
  pluginval:
    name: Plugin Validation (pluginval)
    runs-on: windows-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # Este paso era `git submodule update --init --recursive`, un no-op: el
      # .gitmodules declara el submodulo pero el indice no tiene el gitlink, asi
      # que salia con 0 sin bajar nada. Ver .github/actions/juce/action.yml.
      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          ref: '8.0.4'

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin
        run: cmake --build build --config Release --parallel

      - name: Install pluginval
        run: |
          # pluginval installation would go here
          # For now, skip if not available
          echo "pluginval step - would run pluginval --strictness-level 5"

      # - name: Run pluginval
      #   run: |
      #     $pluginPath = Get-ChildItem -Path build -Filter "*.vst3" -Recurse | Select-Object -First 1
      #     if ($pluginPath) {
      #       pluginval --strictness-level 5 --validate $pluginPath.FullName
      #     }

  # --- Allocation Audit ---
  allocation-audit:
    name: Allocation Audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # Este paso era `git submodule update --init --recursive`, un no-op: el
      # .gitmodules declara el submodulo pero el indice no tiene el gitlink, asi
      # que salia con 0 sin bajar nada. Ver .github/actions/juce/action.yml.
      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          ref: '8.0.4'

      - name: Configure CMake with sanitizers
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="/fsanitize=address /EHsc /Zi /INCREMENTAL:NO" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDebug

      - name: Build with ASan
        run: cmake --build build --config Debug --parallel

      - name: Run tests with ASan
        run: |
          # El ASan de MSVC no implementa detect_leaks, solo en Linux.
          $env:ASAN_OPTIONS = "halt_on_error=1"
          $testExe = Get-ChildItem -Path build -Filter "*Tests*" -Recurse |
            Where-Object { $_.Extension -eq '.exe' } |
            Sort-Object FullName -Unique
          if (-not $testExe) {
            Write-Error "No se encontro ningun ejecutable de test en build/"
            exit 1
          }

          foreach ($exe in $testExe) {
            Write-Host "Ejecutando $($exe.FullName)"
            & $exe.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "$($exe.Name) termino con codigo $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          }

  # --- Security Scan ---
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Check for known vulnerabilities
        run: |
          npx audit-ci --config audit-ci.json || true

  # --- Build Verification ---
  build-verification:
    name: Build Verification
    runs-on: windows-latest
    needs: [schema-validation, registry-generation, vitest, cpp-unit-tests]
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # Este paso era `git submodule update --init --recursive`, un no-op: el
      # .gitmodules declara el submodulo pero el indice no tiene el gitlink, asi
      # que salia con 0 sin bajar nada. Ver .github/actions/juce/action.yml.
      - name: Install JUCE
        uses: ./.github/actions/juce
        with:
          ref: '8.0.4'

      - name: Full Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Verify outputs
        run: |
          $lib = Get-ChildItem -Path build -Filter "*.lib" -Recurse | Where-Object { $_.Name -like "*BankManager*" }
          $dll = Get-ChildItem -Path build -Filter "*.dll" -Recurse | Where-Object { $_.Name -like "*BankManager*" }
          if ($lib -and $dll) {
            Write-Host "✅ Library and DLL found"
          } else {
            Write-Error "Missing build outputs"
            exit 1
          }

  # --- Release ---
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-verification]
    steps:
      - uses: actions/checkout@v7

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/*.dll
            build/*.lib
          generate_release_notes: true