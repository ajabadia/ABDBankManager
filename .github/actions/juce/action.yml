name: Bajar JUCE a GITS/JUCE
description: >
  Baja JUCE al directorio GITS/JUCE del checkout para que el CMakeLists lo
  encuentre con add_subdirectory, en vez de caer en
  find_package(JUCE 8 REQUIRED CONFIG) y morir en Configure CMake.

# POR QUE ESTO NO ES `git submodule update --init --recursive`
# ===========================================================
#
# Porque aqui ese comando no hace NADA, y sale con 0, que es lo peor: un
# paso que parece que ha instalado JUCE y no ha instalado nada.
#
# `.gitmodules` declara el submodulo:
#
#   [submodule "GITS/JUCE"]
#       path = GITS/JUCE
#       url = https://github.com/juce-framework/JUCE.git
#
# pero el indice no tiene el gitlink. Medido en un clon limpio de este repo:
# `git submodule status` sale vacio, `git submodule update --init --recursive`
# sale con 0 y despues GITS/JUCE sigue sin existir. Un .gitmodules sin gitlink
# es una declaracion de intenciones, no un submodulo.
#
# Los tres jobs de windows que morian en Configure CMake ("C++ Unit Tests",
# "Plugin Validation" y "Allocation Audit") tenian un paso "Install JUCE" que
# era exactamente esa linea. Por eso el rojo decia `Could NOT find a package
# configuration file provided by "JUCE"`: JUCE nunca estuvo.
#
# POR QUE UN SHA Y NO UN TAG
# =========================
#
# Porque un tag se puede mover, y el paso no se entera. Un tag movido que
# apunte a otra cosa pasaria en silencio, y lo que se acabaria compilando no
# seria lo que este fichero dice. Con un SHA no hay nada que mover: el commit
# es el commit, dentro de un ano y dentro de diez.
#
# El commit va ademas con la VERSION por separado, y el paso comprueba las dos
# cosas: que lo que hay en disco sea EXACTAMENTE ese commit, y que ese commit
# declare la version que dice declarar. Son dos comprobaciones distintas y
# ninguna de las dos sobra. Si el SHA se cambiara sin querer, la version no
# habria cambiado y el proyecto searia otro; si las dos se cambiaran a mano sin
# comprobar, el grep es el que avisa.
#
# 9.0.1 es la version que se compila, y el commit e18f7f50 es el tag 9.0.1
# upstream (un tag ligero: `git ls-remote` lo da directamente como commit).
# Esta verificado, no supuesto, sobre un clon limpio de este repo en HEAD:
#
#   cmake -S . -B build -DCMAKE_BUILD_TYPE=Release   -> exit 0
#   cmake --build build --config Release            -> exit 0
#   build/cpp/Release/ABDBankManagerCore.lib          -> existe
#   ABDBankManagerCoreTests.exe                       -> 4 de 4 tests, exit 0
#
# AVISO, Y NO SE HA TOCADO. El `CMakeLists.txt` sigue pidiendo
# `find_package(JUCE 8 REQUIRED CONFIG)` en su rama de reserva, y el README y el
# CHANGELOG siguen hablando de JUCE 8. Eso NO afecta a estos jobs: la rama de
# reserva solo se alcanza si GITS/JUCE no existe, y este paso lo pone. Se deja
# dicho aqui porque es la clase de cosa que vuelve a morder dentro de seis
# meses, cuando alguien borre el paso y la reserva pida 8 mientras el arbol
# tiene 9.

inputs:
  version:
    description: Version de JUCE que se espera encontrar tras el checkout
    required: false
    default: '9.0.1'
  sha:
    description: Commit exacto de JUCE que se baja a GITS/JUCE
    required: false
    default: 'e18f7f506c0b96f2c738a0bcd7fe6467a5005ad8'

runs:
  using: composite
  steps:
    - name: Bajar JUCE ${{ inputs.version }} a GITS/JUCE
      shell: bash
      run: |
        set -euo pipefail

        destino="GITS/JUCE"
        version="${{ inputs.version }}"
        sha="${{ inputs.sha }}"

        # IDEMPOTENTE, Y POR QUE. Un runner es de un solo uso, asi que esto
        # casi nunca va a encontrar nada y parece una comprobacion de sobra.
        # Se deja porque el paso se puede reejecutar sobre el mismo checkout
        # (un retry, un job reentrante) y un `rm -rf` a ciegas en ese caso
        # borraria un arbol que ya estaba bien, que es un fallo que no avisa.
        if [ -f "${destino}/CMakeLists.txt" ]; then
          echo "JUCE ya esta en ${destino}: no se toca."
          exit 0
        fi

        rm -rf "${destino}"

        # UN SHA NO ES UN `--branch`. Por eso no es un `git clone --branch`:
        # `--branch` espera un nombre de rama o de tag, y un SHA no lo es, asi
        # que el clon fallaria con un error que no nombra el pin. Lo que baja
        # un commit concreto es `git fetch` por SHA, que GitHub permite porque
        # el commit es alcanzable desde el tag. Se separa en init/fetch/checkout
        # por eso, y no por gusto.
        git init --quiet "${destino}"
        git -C "${destino}" remote add origin https://github.com/juce-framework/JUCE.git
        git -C "${destino}" fetch --quiet --depth 1 origin "${sha}"
        git -C "${destino}" checkout --quiet --detach FETCH_HEAD

        # LA PRIMERA COMPROBACION: que lo que hay sea el commit pedido. El grep
        # de la version, solo, no serviria: dos commits distintos pueden declarar
        # la misma version, y entonces el paso estaria en verde sobre un arbol
        # que no es el fijado.
        actual="$(git -C "${destino}" rev-parse HEAD)"
        if [ "${actual}" != "${sha}" ]; then
          echo "::error::GITS/JUCE esta en ${actual} y el pin es ${sha}. Aborto: compilar con otro commit es peor que no compilar."
          exit 1
        fi

        # LA SEGUNDA: que ese commit diga ser la version que pedimos.
        if ! grep -q "project(JUCE VERSION ${version} " "${destino}/CMakeLists.txt"; then
          echo "::error::GITS/JUCE esta en el commit ${actual}, que no dice ser JUCE ${version}. Aborto."
          grep -m1 'project(JUCE VERSION' "${destino}/CMakeLists.txt" || true
          exit 1
        fi

        echo "JUCE ${version} en ${destino} (commit ${sha})"
        grep -m1 'project(JUCE VERSION' "${destino}/CMakeLists.txt"